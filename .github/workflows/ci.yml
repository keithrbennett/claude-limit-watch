name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake rubocop

  spec:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 2.6 is the oldest supported (macOS's system Ruby). Quoted, so
        # 3.0 isn't read as 3.
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Specs
        run: bundle exec rake
      - name: Build the gem
        run: gem build claude-limit-watch.gemspec
      - name: Run the executable
        run: |
          exe/claude-limit-watch --version
          exe/claude-limit-watch --help
          exe/claude-limit-watch --once --file "$RUNNER_TEMP/history.jsonl"
