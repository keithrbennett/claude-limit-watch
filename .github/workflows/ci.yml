name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake rubocop

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Relative links and #anchors only (--offline). Passing the directory,
      # not a glob, makes lychee walk it, skipping gitignored files; a glob
      # would be re-expanded by the action's shell. Keep the version and
      # args in step with the local command in the README's Development
      # section and docs/dev/RELEASING.md (Dependabot doesn't update them).
      # The action takes the version with a leading "v"; the Docker image
      # tag has none.
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress --extensions md .

  spec:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 2.6 is the oldest supported (macOS's system Ruby). Quoted, so
        # 3.0 isn't read as 3.
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Specs
        run: bundle exec rake
      - name: Build the gem
        run: gem build claude-limit-watch.gemspec
      - name: Check the gem includes every tracked file it should ship
        run: |
          diff <(gem spec claude-limit-watch-*.gem files | sed -n 's/^- //p' | LC_ALL=C sort) \
               <(git ls-files -- lib exe docs/images README.md RELEASE_NOTES.md LICENSE | LC_ALL=C sort)
      - name: Run the executable
        run: |
          exe/claude-limit-watch --version
          exe/claude-limit-watch --help
          exe/claude-limit-watch --once --file "$RUNNER_TEMP/history.jsonl"
